name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: dnascorpionofficial
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake"
          file_pattern: "assets/github-snake-dark.svg"

      - name: Delete old runs (keep only this one)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
          done
