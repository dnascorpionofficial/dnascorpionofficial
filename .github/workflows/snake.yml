name: generate-snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: dnascorpionofficial
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark

      - name: Keep snake inside the graph
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("assets/github-snake-dark.svg")
          s = p.read_text()
          m = re.match(r'<svg viewBox="-16 -32 (\d+) (\d+)" width="\d+" height="\d+"', s)
          if m:
              w, h = int(m.group(1)) - 32, int(m.group(2)) - 80
              s = s.replace(m.group(0), f'<svg viewBox="0 0 {w} {h}" width="{w}" height="{h}"', 1)
              p.write_text(s)
          PY

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update snake"
          file_pattern: "assets/github-snake-dark.svg"

      - name: Delete old generate-snake runs (keep only this one)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/workflows/snake.yml/runs" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
          done
