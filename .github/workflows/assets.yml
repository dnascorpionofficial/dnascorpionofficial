name: generate-assets

# Rebuilds every profile SVG from scripts/ (with scripts/config.py).
# The snake is NOT built here - snake.yml owns it.
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate SVGs
        run: python3 scripts/generate.py

      - name: Commit changed SVGs
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate svgs"
          file_pattern: "assets/*.svg"

      - name: Delete old generate-assets runs (keep only this one)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/workflows/assets.yml/runs" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
          done
